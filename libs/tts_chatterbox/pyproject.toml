[project]
name = "tts-chatterbox"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    "boto3>=1.37",
]

[dependency-groups]
dev = [
    "moto>=5.2",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tts_chatterbox", "src/artifact_store"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
