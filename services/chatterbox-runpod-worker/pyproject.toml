[project]
name = "chatterbox-runpod-worker"
version = "0.1.0"
# Matches services/chatterbox-tts (chatterbox 0.1.6 + torch 2.6 wheels are 3.11).
# EXCLUDED from the host uv workspace (root pyproject [tool.uv.workspace] exclude);
# its deps (torch+cu124, runpod, chatterbox) install in-image only.
requires-python = "==3.11.*"
dependencies = [
    "runpod>=1.9",
    "boto3>=1.37",
    "httpx>=0.27",
    "structlog>=24.1",
    "chatterbox-tts==0.1.6",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-mock>=3.15.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatterbox_runpod_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
