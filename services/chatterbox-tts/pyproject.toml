[project]
name = "chatterbox-tts-service"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "chatterbox-tts==0.1.6",
    # torch/torchaudio installed via pip --index-url in Dockerfile;
    # listed here so the installed-in-container `pip install -e .` resolves
    # against the already-installed wheels (no second download).
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "structlog>=24.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.23",  # quick-260602-b7l: worker tests need async
    "httpx>=0.27",   # FastAPI TestClient backend
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/chatterbox_tts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
